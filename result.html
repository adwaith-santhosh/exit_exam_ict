<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {background: linear-gradient(135deg,#f8fafc 0%,#e9eef8 100%);} 
      .result-card {max-width:700px;margin:6rem auto;padding:2rem;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(34,41,47,0.08)}
      .value {font-size:2.25rem;font-weight:700;color:#0d6efd}
    </style>
  </head>
  <body>
    <div class="result-card text-center">
      <h2 class="mb-3">Predicted Annual Revenue</h2>
      <div class="mb-4">
        <span class="value">{{ value }}</span>
      </div>
      <a class="btn btn-primary me-2" href="/">Start Over</a>
      <a class="btn btn-outline-secondary" href="/predict">New Prediction</a>
    </div>
  </body>
</html>
